version: '3.8'

services:
  aurum-desk:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aurum-cloud-engine
    restart: unless-stopped
    ports:
      - "6080:6080"   # noVNC Web Browser GUI (Access MT5 via http://<server-ip>:6080/vnc.html)
      - "8501:8501"   # Streamlit Local Dashboard
    environment:
      - AURUM_TELEGRAM_BOT_TOKEN=${AURUM_TELEGRAM_BOT_TOKEN:-}
      - AURUM_TELEGRAM_CHAT_ID=${AURUM_TELEGRAM_CHAT_ID:-}
      - TWELVE_DATA_API_KEY=${TWELVE_DATA_API_KEY:-}
    volumes:
      - mt5_wine_data:/root/.wine
      - ./reports:/app/reports
      - ./config:/app/config
    shm_size: '1gb'

volumes:
  mt5_wine_data:
