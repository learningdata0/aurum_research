[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :1 -screen 0 1920x1080x24
autorestart=true
priority=10

[program:x11vnc]
command=x11vnc -display :1 -nopw -listen 0.0.0.0 -xkb -ncache 10 -forever -shared
autorestart=true
priority=20

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
priority=30

[program:mt5]
command=wine "/root/.wine/drive_c/Program Files/MetaTrader 5/terminal64.exe" /config:startup.ini /portable
directory=/root/.wine/drive_c/Program Files/MetaTrader 5
environment=DISPLAY=":1",WINEPREFIX="/root/.wine"
autorestart=true
priority=40
