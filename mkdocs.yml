site_name: AURUM Institutional Quantitative Desk
site_description: Autonomous Institutional Trading System for US100 and Gold (XAUUSD)
site_author: AURUM Quantitative Research
site_url: https://nouh.github.io/aurum_research

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: amber
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: amber
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Architecture:
      - System Architecture: architecture/overview.md
      - Operational Playbook: OPERATIONAL_PLAYBOOK_v0.8.md
  - Strategy & Microstructure:
      - H17 London Sweep & Reclaim: strategies/h17_london_sweep.md
      - Intraday Market Clock: strategies/market_clock.md
  - Validation & Research Lab:
      - Institutional Research Report: research/institutional_lab.md
      - Trailing Stop & TP1 Empirical Study: research/trailing_and_flip_study.md
  - Episodic Market Memory:
      - Causal Macro Journal: memory/journal.md
  - Live Gate 2 Execution:
      - Forward Shadow Ledger: live/gate2_ledger.md
